# Render Blueprint (free): Dashboard → New → Blueprint → pick this repo.
# Only the frontend runs on Render. The backend runs on a laptop via scripts/serve-public.sh,
# which prints a Cloudflare tunnel URL; put it in the /api/* rewrite below (or edit the rule
# in the dashboard under Redirects/Rewrites; it changes whenever the script restarts).
services:
  - type: web
    name: floodline
    runtime: static
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      # Same-origin /api like the Vite dev proxy, so the browser never needs CORS.
      - type: rewrite
        source: /api/*
        destination: https://REPLACE-WITH-TUNNEL.trycloudflare.com/*
      - type: rewrite
        source: /*
        destination: /index.html
