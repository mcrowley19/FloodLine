# Render Blueprint (free): Dashboard → New → Blueprint → pick this repo.
# Only the frontend runs on Render. The backend runs on a laptop via scripts/serve-public.sh,
# which exposes it at a fixed Tailscale Funnel URL (https://<machine>.<tailnet>.ts.net).
# Both rules must be Rewrites (not Redirects) if edited in the dashboard.
services:
  - type: web
    name: floodline
    runtime: static
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      # Same-origin /api like the Vite dev proxy, so the browser never needs CORS.
      - type: rewrite
        source: /api/*
        destination: https://michaels-macbook-air-3.tail7a2ad6.ts.net/*
      - type: rewrite
        source: /*
        destination: /index.html
