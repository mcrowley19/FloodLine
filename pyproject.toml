[project]
name = "floodline"
version = "0.1.0"
description = "Ireland-wide flood lead-time tool for county councils"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "polars>=1.8",
    "lightgbm>=4.5",
    "numpy>=1.26,<3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "rasterio>=1.3",
]

[project.scripts]
floodline = "floodline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
